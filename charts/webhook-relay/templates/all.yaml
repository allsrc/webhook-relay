apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  config.yaml: |
{{ .Values.config | toYaml | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # SQLite on a ReadWriteOnce volume: never two writers
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:
        checksum/config: {{ .Values.config | toYaml | sha256sum }}
    spec:
      securityContext: {fsGroup: 10001}
      containers:
        - name: relay
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{containerPort: 8080}]
          env:
            - {name: RELAY_CONFIG, value: /etc/relay/config.yaml}
            - name: WHATSAPP_VERIFY_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: whatsapp-verify-token}}
            - name: WHATSAPP_APP_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.secretName }}, key: whatsapp-app-secret}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 30}
          resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true}
          volumeMounts:
            - {name: config, mountPath: /etc/relay}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-config}
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector: {app: {{ .Release.Name }}}
  ports:
    - port: 8080
      targetPort: 8080
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
